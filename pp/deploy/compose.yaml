name: pp-code

services:
  web:
    image: pp-code-web:local
    build:
      context: ../..
      dockerfile: pp/deploy/Dockerfile
      target: web
      args:
        VITE_PP_HOME_URL: ${VITE_PP_HOME_URL:-}
        VITE_PP_CHAT_URL: ${VITE_PP_CHAT_URL:-}
        VITE_PP_FLOW_URL: ${VITE_PP_FLOW_URL:-}
    environment:
      PP_DOMAIN: ${PP_DOMAIN:?Set PP_DOMAIN to the hostname you control}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - ingress

  backend:
    image: pp-code-backend:local
    build:
      context: ../..
      dockerfile: pp/deploy/Dockerfile
      target: backend
    environment:
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?Set a random server password of at least 32 characters}
      PP_ROUTER_API_KEY: ${PP_ROUTER_API_KEY:?Set a random internal router token of at least 32 characters}
      PP_ROUTER_BASE_URL: http://router:8787/v1
    volumes:
      - opencode-data:/var/lib/opencode
      - workspace:/workspace
      - operator-home:/home/bun
      - type: bind
        source: ./opencode.json
        target: /config/opencode.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:4096/api/info", {headers: {Authorization: "Basic " + btoa("opencode:" + process.env.OPENCODE_PASSWORD)}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ingress
      - models

  router:
    image: pp-code-router:local
    build:
      context: ../..
      dockerfile: pp/deploy/Dockerfile
      target: router
    environment:
      PP_ROUTER_CONFIG: /config/router.json
      PP_ROUTER_API_KEY: ${PP_ROUTER_API_KEY:?Set a random internal router token of at least 32 characters}
      PP_UPSTREAM_API_KEY: ${PP_UPSTREAM_API_KEY:?Set your upstream model provider API key}
    volumes:
      - type: bind
        source: ./router.global.json
        target: /config/router.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8787/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - models

networks:
  ingress:
  models:

volumes:
  workspace:
  opencode-data:
  operator-home:
  caddy-data:
  caddy-config:
